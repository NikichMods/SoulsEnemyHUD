name: SoulsEnemyHUD offline tests

on:
  push:
    branches: [main, "fix/**", "feature/**"]
    paths: ["Scripts/**", "UI/**", "tests/**", "research/**", "tools/**", "VERSION", "requirements-test.txt", ".github/workflows/tests.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Lua harness
        run: python -m pip install -r requirements-test.txt
      - name: Check policy, adapters, scheduler and authored UI
        run: python tools/test.py
